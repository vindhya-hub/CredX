# CredX: PostgreSQL + API + nginx-served frontend (Redis optional).
#
#   cd backend && npm run setup:env -- --docker   # creates ../.env with random secrets
#   cd .. && docker compose up --build            # http://localhost:8080
#
# Secrets come only from the gitignored CredX-Fintech/.env (see .env.example);
# compose refuses to start while a required one is missing.
# Optional Redis rate-limit store: set REDIS_URL=redis://redis:6379 in .env and
#   docker compose --profile redis up --build

name: credx

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credx}
      POSTGRES_USER: ${POSTGRES_USER:-credx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in CredX-Fintech/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-credx}
      DB_USER: ${POSTGRES_USER:-credx}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in CredX-Fintech/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in CredX-Fintech/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in CredX-Fintech/.env}
      CARD_FINGERPRINT_SECRET: ${CARD_FINGERPRINT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Only nginx talks to the API (its port is not published), so trust one proxy hop.
      TRUST_PROXY: "1"
      REDIS_URL: ${REDIS_URL:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-transformers}
      EMBEDDINGS_CACHE_DIR: /app/.model-cache
    volumes:
      - model-cache:/app/.model-cache

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      # Bound to localhost; change to "8080:80" to expose it on your network.
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  model-cache:
